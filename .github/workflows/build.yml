name: Build ORCT2-web

# 커밋/푸시해도 자동으로 빌드하지 않아요. Actions 탭 → Build ORCT2-web → "Run workflow" 로 직접 실행하세요.
on:
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 들어오면 진행 중인 이전 빌드는 취소 (빌드가 겹치지 않게)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # 러너 디스크 확보 (emsdk + ICU 빌드가 커서 기본 여유 공간으로는 빠듯함)
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive   # OpenRCT2, emsdk, icu, openssl ... 전부 받음

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # 1) 도커 이미지 빌드 (+ main 푸시 시 GHCR에 올림)
      #    :latest 는 덮어쓰이지만 :커밋해시 태그는 남아서, 망한 빌드가 생겨도 이전 커밋 버전으로 되돌릴 수 있음
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) 정적 파일(wasm/js/html)만 뽑아서 artifact로 저장 (캐시 히트라 빠름)
      - name: Export static site
        uses: docker/build-push-action@v6
        with:
          context: .
          outputs: type=local,dest=out
          cache-from: type=gha

      - uses: actions/upload-artifact@v4
        with:
          name: orct2-web-www
          path: out/usr/share/nginx/html
          retention-days: 14
